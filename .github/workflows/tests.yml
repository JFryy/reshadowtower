name: Asset-free tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-free-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel-20261101.0.620205@sha256:2de80105abb49f813a85393c6758a4334deb6bcec4a2411bd2f059c0bee6ee4c
    timeout-minutes: 20
    steps:
      - name: Install build and graphics test dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja gcc clang python uv sdl3 mesa \
            xorg-server-xvfb xorg-xauth glslang
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Resolve pinned framework dependencies
        run: uv run python tools/dependencies.py
      - name: Build, test and lint the launcher
        run: |
          cmake -S launcher -B build-launcher-ci -G Ninja -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSHADOWTOWER_WARNINGS_AS_ERRORS=ON \
            -DPSXRECOMP_ROOT="$PWD/build-dependencies/_deps/psxrecomp-src"
          cmake --build build-launcher-ci
          ctest --test-dir build-launcher-ci --output-on-failure
          clang-tidy -p build-launcher-ci --checks='clang-analyzer-*' \
            --header-filter='.*/launcher/.*' --warnings-as-errors='*' launcher/*.cpp
      - name: Run tests with required software OpenGL coverage
        env:
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a uv run python tools/run_tests.py

  windows:
    name: Windows tests and native build
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Install dependency bootstrap tools
        run: |
          uv tool install ninja==1.11.1.4
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Resolve pinned framework dependencies
        run: uv run python tools/dependencies.py
      - name: Run portable unit tests
        run: |
          uv run python -m unittest tests.test_dependencies tests.test_distribution \
            tests.test_generate_aot tests.test_launcher_backend tests.test_bundled_toolchain \
            tests.test_render_scale
      - name: Download verified Windows toolchain
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import sys
          import urllib.request
          sys.path.insert(0, 'tools')
          from bundled_toolchain import PINS
          from release_common import file_hash
          url, checksum = PINS['windows-x64']
          archive = Path('build-inputs/toolchain.zip')
          archive.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(url, archive)
          if file_hash(archive) != checksum:
              raise SystemExit('Windows toolchain checksum mismatch')
          PY
      - name: Build native launcher and emitters and run launcher tests
        run: |
          uv run python tools/build_release.py --toolchain-archive build-inputs/toolchain.zip --output build-offline
          test -s build-offline/host/shadowtower-launcher.exe
          test -s build-offline/emitters/psxrecomp-game.exe
          test -s build-offline/emitters/psxrecomp-bios.exe
          test -s build-offline/launcher/ReShadowTower.exe
      - name: Stage and check the offline release payload
        run: |
          uv run python tools/package_release.py --build build-offline/host \
            --emitters build-offline/emitters --platform windows-x64 \
            --toolchain-archive build-inputs/toolchain.zip \
            --windows-launcher build-offline/launcher/ReShadowTower.exe \
            --output dist/package
          test -s dist/package/release.json
          test -s dist/package/payload/launcher/bundled-imgui/imgui.cpp
          test -s dist/package/payload/psxrecomp/runtime/runtime.cmake
          test -s dist/package/payload/psxrecomp/lib/recomp-net/CMakeLists.txt
          test -s dist/package/payload/psxrecomp/lib/retcomm-rbengine/CMakeLists.txt
