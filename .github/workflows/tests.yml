name: Asset-free tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-free-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build and graphics test dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja gcc python python-opengl sdl3 mesa \
            xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve pinned framework dependencies
        run: python3 tools/dependencies.py
      - name: Check shell syntax
        run: bash -n scripts/build.sh scripts/run.sh
      - name: Run tests with required software OpenGL coverage
        env:
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tools/run_tests.py

  windows:
    name: Windows tests and native build
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependency bootstrap tools
        run: python -m pip install ninja==1.11.1.4
      - name: Resolve pinned framework dependencies
        run: python tools/dependencies.py
      - name: Run portable unit tests
        run: |
          python -m unittest tests.test_dependencies tests.test_distribution \
            tests.test_generate_aot tests.test_launcher_backend tests.test_bundled_toolchain
      - name: Download verified Windows toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import urllib.request
          sys.path.insert(0, 'tools')
          from bundled_toolchain import PINS
          from release_common import file_hash
          url, checksum = PINS['windows-x64']
          archive = Path('build-inputs/toolchain.zip')
          archive.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(url, archive)
          if file_hash(archive) != checksum:
              raise SystemExit('Windows toolchain checksum mismatch')
          PY
      - name: Build native launcher and emitters and run launcher tests
        run: |
          python tools/build_release.py --toolchain-archive build-inputs/toolchain.zip --output build-offline
          test -s build-offline/host/shadowtower-launcher.exe
          test -s build-offline/emitters/psxrecomp-game.exe
          test -s build-offline/emitters/psxrecomp-bios.exe
          test -s build-offline/launcher/ReShadowTower.exe
