name: Offline release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-release
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download pinned build inputs
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, urllib.request
          sys.path.insert(0, 'tools')
          from bundled_toolchain import PINS
          from build_bundled_sdl import download_inputs
          from make_distribution import APPIMAGETOOL_URL, APPIMAGETOOL_SHA256, INNO_URL, INNO_SHA256, verify_tool
          platform = os.environ['RELEASE_PLATFORM']
          pathlib.Path('build-inputs').mkdir()
          url, checksum = PINS[platform]
          archive = pathlib.Path('build-inputs/toolchain.zip')
          urllib.request.urlretrieve(url, archive)
          verify_tool(archive, checksum)
          if platform == 'linux-x64':
              download_inputs(pathlib.Path('build-inputs'))
          url, checksum = (INNO_URL, INNO_SHA256) if platform == 'windows-x64' else (APPIMAGETOOL_URL, APPIMAGETOOL_SHA256)
          tool = pathlib.Path('build-inputs/packager.exe' if platform == 'windows-x64' else 'build-inputs/packager.AppImage')
          urllib.request.urlretrieve(url, tool)
          verify_tool(tool, checksum)
          PY
      - name: Targeted packaging tests
        run: |
          python -m unittest discover -s tests -p 'test_release_launcher.py'
          python -m unittest discover -s tests -p 'test_source_adapters.py'
          python -m unittest discover -s tests -p 'test_distribution.py'
      - name: Archive safety and emitter discovery tests
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p 'test_bundled_toolchain.py'
          python -m unittest discover -s tests -p 'test_generate_aot.py'
      - name: Build without game data
        run: |
          extra=()
          if [[ '${{ matrix.platform }}' == linux-x64 ]]; then extra+=(--sdl-archive build-inputs/SDL3-3.4.10.tar.gz); fi
          python tools/build_release.py --toolchain-archive build-inputs/toolchain.zip --output build-offline "${extra[@]}"
      - name: Stage verified package
        run: |
          extra=()
          if [[ '${{ matrix.platform }}' == windows-x64 ]]; then
            extra+=(--windows-launcher build-offline/launcher/ReShadowTower.exe)
          fi
          python tools/package_release.py --build build-offline/host \
            --emitters build-offline/emitters --platform '${{ matrix.platform }}' \
            --toolchain-archive build-inputs/toolchain.zip --output dist/package "${extra[@]}"
      - name: Build AppImage or installer
        run: |
          tool=build-inputs/packager.AppImage
          if [[ '${{ matrix.platform }}' == windows-x64 ]]; then tool=build-inputs/packager.exe; fi
          python tools/make_distribution.py --package dist/package --tool "$tool" --output-dir dist/artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReShadowTower-${{ matrix.platform }}
          path: dist/artifacts/*
          if-no-files-found: error

  draft-release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --dir dist \
            --name ReShadowTower-linux-x64 --name ReShadowTower-windows-x64
          for platform in linux windows; do
            (cd "dist/ReShadowTower-$platform-x64" && sha256sum -c -- *.sha256)
          done
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          tag="v$version"
          assets=(
            "dist/ReShadowTower-linux-x64/ReShadowTower-$version-x86_64.AppImage"
            "dist/ReShadowTower-linux-x64/ReShadowTower-$version-x86_64.AppImage.sha256"
            "dist/ReShadowTower-windows-x64/ReShadowTower-$version-windows-x64-setup.exe"
            "dist/ReShadowTower-windows-x64/ReShadowTower-$version-windows-x64-setup.exe.sha256"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          existing=$(gh api "repos/$GH_REPO/releases" --paginate | jq -r --arg tag "$tag" \
            '.[] | select(.tag_name == $tag) | [.draft, .target_commitish] | @tsv')
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            git fetch origin "refs/tags/$tag"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
              echo "$tag points to another commit. Bump VERSION before releasing." >&2
              exit 1
            fi
          fi
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$(printf 'true\t%s' "$GITHUB_SHA")" ]]; then
              echo "$tag is published or targets another commit. Bump VERSION or remove the obsolete draft." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --draft --target "$GITHUB_SHA" \
              --title "ReShadowTower $tag" --generate-notes \
              --notes "Linux: make the AppImage executable and launch it. Windows: run the installer. First-run setup requires your own Shadow Tower (USA) BIN/CUE dump; build tools are bundled."
          fi
          gh release view "$tag" --json url --jq '"Draft release: " + .url' >> "$GITHUB_STEP_SUMMARY"
