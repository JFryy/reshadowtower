name: Feature request
description: Propose an enhancement to the game port, launcher, or tooling.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change?
      description: If this changes original game behaviour, say how the original stays available.
    validations:
      required: true
