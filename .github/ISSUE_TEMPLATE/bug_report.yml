name: Bug report
description: Report a crash, rendering or audio problem, gameplay bug, or setup failure.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach disc images, game files, BIOS dumps, memory cards, or save states.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      description: The download you installed, not your operating system.
      options:
        - Windows installer
        - Linux AppImage
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, or `git rev-parse --short HEAD` for source builds.
      placeholder: 0.3.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and GPU. Mention Wine or Proton if you use it.
      placeholder: Windows 11, Nvidia RTX 3060
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and settings
      description: Optional. Paste `launcher.log`, or `settings.toml` and `input.ini` for rendering and input problems. [Where to find them](https://github.com/JFryy/reshadowtower/blob/main/CONTRIBUTING.md#reporting-bugs).
      render: text
